name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.13']
        # Python 3.9 has no Ubuntu 26.04 or macOS ARM64 build in setup-python.
        # Keep minimum-version coverage on compatible runners as latest moves.
        include:
          - os: ubuntu-24.04
            python: '3.9'
          - os: macos-15-intel
            python: '3.9'
          - os: windows-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Check Unix launcher
        if: runner.os != 'Windows'
        run: bash setup-external-api.sh --help
      - name: Check PowerShell launcher
        shell: pwsh
        run: ./setup-external-api.ps1 --help
